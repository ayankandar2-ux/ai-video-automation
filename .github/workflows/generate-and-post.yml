name: Generate and Post Video

on:
  schedule:
    # 4 runs/day, spaced ~6 hours apart (UTC). Adjust to your posting-time preference.
    - cron: "0 2 * * *"
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Force a specific content type (leave blank for random)"
        required: false
        type: choice
        options:
          - ""
          - anime_scene
          - macro_abstract

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python scripts/run_pipeline.py --out output.mp4 ${{ github.event.inputs.type != '' && format('--type {0}', github.event.inputs.type) || '' }} 2>&1 | tee pipeline-output.log

      - name: Post pipeline log tail as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAIL=$(tail -c 55000 pipeline-output.log 2>/dev/null || echo "(no log file produced)")
          STATUS="${{ steps.pipeline.outcome }}"
          BODY=$(printf '### Pipeline result: %s\n\n```\n%s\n```' "$STATUS" "$TAIL")
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<< "$BODY")"

      - name: Fail job if pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1

      - name: Upload artifact for inspection
        if: steps.pipeline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output.mp4
          retention-days: 3
